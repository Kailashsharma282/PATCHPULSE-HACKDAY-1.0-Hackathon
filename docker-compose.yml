services:
  postgres:
    image: postgres:16-alpine
    container_name: patchpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: patchpulse
      POSTGRES_PASSWORD: patchpulse_secret
      POSTGRES_DB: patchpulse_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U patchpulse -d patchpulse_db']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: patchpulse-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: patchpulse-api
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: 'postgresql://patchpulse:patchpulse_secret@postgres:5432/patchpulse_db?schema=public'
      REDIS_URL: 'redis://redis:6379'
      JWT_SECRET: 'patchpulse_hackday_jwt_secret_key_2026_super_secure_token'
      AI_MODE: 'mock'
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
